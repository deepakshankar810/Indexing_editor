<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="Professional patent sequence indexing workspace for Clarivate Geneseq analysts with bulk editing, smart thesaurus mapping, 72-char DE validator, and export." />
    <meta property="og:title" content="Clarivate Geneseq Master Workspace" />

    <script>
      try {
        const theme = localStorage.getItem('clarivate_theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
